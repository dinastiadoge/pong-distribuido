; Abra a pasta "firmware" no VS Code (PlatformIO).
; Upload: pio run -e player1 -t upload   |   pio run -e player2 -t upload
; Monitor serial: pio device monitor -e player1
; Com as duas placas conectadas ao mesmo tempo, cada ambiente grava na sua porta.

[platformio]
src_dir = pong_player

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    links2004/WebSockets

; As portas COM abaixo dependem de qual entrada USB cada placa usa.
; Se mudar de lugar, confira com: pio device list
[env:player1]
build_flags = -DPLAYER_ID=\"player1\"
upload_port = COM4
monitor_port = COM4

[env:player2]
build_flags = -DPLAYER_ID=\"player2\"
upload_port = COM6
monitor_port = COM6
